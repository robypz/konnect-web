@if (message) {
@if (message.employee_id != employeeId) {
<div class="flex justify-end items-center">
  <div class="rounded rounded-md  bg-blue-300 p-2 max-w-100">
    <p>
      {{message.content}}
    </p>
  </div>
</div>
}
@else {
<div class="flex justify-start items-center mb-6">
  <div class="rounded rounded-md bg-gray-100 p-2 max-w-100">
    <p>
      {{message.content}}
    </p>
  </div>
</div>
}



}
