<div class="bg-white shadow-md rounded-md p-4 min-h-[82dvh] overflow-y-auto dark:bg-gray-800">
  <div>
    <form action="" [formGroup]="searchEmployeeForm">
      <input type="search" placeholder="Search" (input)="search($event)" formControlName="search"
        class="w-full p-2 rounded-md border border-gray-300 dark:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </form>
  </div>

  <div class="mt-3 rounded-md border border-gray-300">
    <div>
      @for (employee of employees; track employee.id) {
      <app-contact [_employee]="employee" [(selectedEmployee)]="selectedEmployee"></app-contact>
      }
    </div>
  </div>

</div>
